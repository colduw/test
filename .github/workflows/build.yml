name: Java CI with Gradle

on:
  workflow_dispatch:
    inputs:
      modversion:
        description: "Mod version"
        type: string
        required: true
      branch:
        description: "Branch to build against"
        type: choice
        required: true
        options:
          - 1.21.6
          - 1.21.7
          - 1.21.8
          - 1.21.9
          - 1.21.11
          - 26.1
          - 26.2
          - 26.3
      neoforge:
        description: "Build NeoForge"
        type: boolean
      forge:
        description: "Build Forge"
        type: boolean
      fabric:
        description: "Build Fabric"
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: "mainfr"

    ######################################################################

    - name: Checkout to ${{ inputs.branch }}
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.branch }}
    
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: |
          21
          25
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    ##############################################################################################

    - if: ${{ inputs.neoforge }}
      name: Build with Gradle Wrapper (NeoForge)
      run: ./gradlew :neoforge:build
      env:
        ORG_GRADLE_PROJECT_mod_version: ${{ inputs.branch }}-${{ inputs.modversion }}
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

    - if: ${{ inputs.neoforge }}
      name: Upload built Jar (NeoForge)
      uses: softprops/action-gh-release@v3
      with:
        tag_name: "${{ inputs.branch }}-neoforge-${{ inputs.modversion }}"
        name: "${{ inputs.branch }} ${{ inputs.modversion }} NeoForge Release"
        target_commitish: ${{ inputs.branch }}
        body_path: CHANGELOG.md
        draft: true
        prerelease: false
        files: |
          ./neoforge/build/libs/*.jar
        fail_on_unmatched_files: true

    ##############################################################################################

    - if: ${{ inputs.forge }}
      name: Build with Gradle Wrapper (Forge)
      run: ./gradlew :forge:build :forge:publishMods
      env:
        ORG_GRADLE_PROJECT_mod_version: ${{ inputs.branch }}-${{ steps.get_forge_version.outputs.version }}
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

    - if: ${{ inputs.forge }}
      name: Upload built Jar (Forge)
      uses: softprops/action-gh-release@v3
      with:
        tag_name: "${{ inputs.branch }}-forge-${{ steps.get_forge_version.outputs.version }}"
        name: "${{ inputs.branch }} ${{ steps.get_forge_version.outputs.version }} Forge Release"
        target_commitish: ${{ inputs.branch }}
        body_path: CHANGELOG.md
        draft: true
        prerelease: false
        files: |
          ./forge/build/libs/*.jar
        fail_on_unmatched_files: true

    ##############################################################################################

    - if: ${{ inputs.fabric }}
      name: Build with Gradle Wrapper (Fabric)
      run: ./gradlew :fabric:build :fabric:publishMods
      env:
        ORG_GRADLE_PROJECT_mod_version: ${{ inputs.branch }}-${{ steps.get_fabric_version.outputs.version }}
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

    - if: ${{ inputs.fabric }}
      name: Upload built Jar (Fabric)
      uses: softprops/action-gh-release@v3
      with:
        tag_name: "${{ inputs.branch }}-fabric-${{ steps.get_fabric_version.outputs.version }}"
        name: "${{ inputs.branch }} ${{ steps.get_fabric_version.outputs.version }} Fabric Release"
        target_commitish: ${{ inputs.branch }}
        body_path: CHANGELOG.md
        draft: true
        prerelease: false
        files: |
          ./fabric/build/libs/*.jar
        fail_on_unmatched_files: true
