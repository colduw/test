name: Java CI with Gradle

on:
  workflow_dispatch:
    inputs:
      neoforge:
        description: "Build NeoForge"
        type: boolean
      forge:
        description: "Build Forge"
        type: boolean
      fabric:
        description: "Build Fabric"
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: "main"
    
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - if: ${{ inputs.neoforge }}
      name: Build with Gradle Wrapper
      run: ./gradlew :neoforge:build
      env:
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

    - if: ${{ inputs.forge }}
      name: Build with Gradle Wrapper
      run: ./gradlew :forge:build
      env:
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

    - if: ${{ inputs.fabric }}
      name: Build with Gradle Wrapper
      run: ./gradlew :fabric:build
      env:
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

    - if: ${{ inputs.fabric }}
      name: Get version from file
      id: get_version
      run: echo "fabricversion=$(head -n 1 'fabric/VERSION')" >> $GITHUB_OUTPUT
      shell: bash

    - if: ${{ inputs.fabric }}
      name: Upload built Jar
      uses: softprops/action-gh-release@v3
      with:
        tag_name: "${{ github.ref_name }}-fabric-${{ steps.get_version.outputs.fabricversion }}"
        name: "${{ github.ref_name }} ${{ steps.get_version.outputs.fabricversion }} Fabric"
        target_commitish: ${{ github.sha }}
        body_path: CHANGELOG.md
        draft: true
        prerelease: false
        files: |
          ./fabric/build/libs/*.jar
          ./neoforge/build/libs/*.jar
          ./forge/build/libs/*.jar
        fail_on_unmatched_files: false
