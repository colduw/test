name: Java CI with Gradle

on:
  workflow_dispatch:
    inputs:
      neoforge:
        description: "Build NeoForge"
        required: true
        type: boolean
      forge:
        description: "Build Forge"
        required: true
        type: boolean
      fabric:
        description: "Build Fabric"
        required: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: "main"
    
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Build with Gradle Wrapper
      run: ./gradlew build
      env:
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

    - name: Create Epoch Timestamp
      id: epoch_timestamp
      run: echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT
      shell: bash

    - name: Upload built Jar
      uses: softprops/action-gh-release@v3
      with:
        tag_name: "26.3-${{ steps.epoch_timestamp.outputs.timestamp }}"
        name: "26.3 (Neo)Forge/Fabric Release"
        body_path: CHANGELOG.md
        draft: true
        prerelease: false
        files: |
          ./fabric/build/libs/*.jar
          ./neoforge/build/libs/*.jar
          ./forge/build/libs/*.jar
        fail_on_unmatched_files: true
