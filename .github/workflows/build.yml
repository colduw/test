name: Java CI with Gradle

on:
  workflow_dispatch:
    inputs:
      branch:
        type: choice
        required: true
        options:
          - 1.21.6-neoforge
      neoforge:
        description: "Build NeoForge"
        type: boolean
      forge:
        description: "Build Forge"
        type: boolean
      fabric:
        description: "Build Fabric"
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: "main"
    
    - if: ${{ inputs.neoforge }}
      name: Get version from file (NeoForge)
      id: get_neoforge_version
      run: echo "version=$(head -n 1 'neoforge-VERSION')" >> $GITHUB_OUTPUT
      shell: bash

    - if: ${{ inputs.forge }}
      name: Get version from file (Forge)
      id: get_forge_version
      run: echo "version=$(head -n 1 'forge-VERSION')" >> $GITHUB_OUTPUT
      shell: bash

    - if: ${{ inputs.fabric }}
      name: Get version from file (Fabric)
      id: get_fabric_version
      run: echo "version=$(head -n 1 'fabric-VERSION')" >> $GITHUB_OUTPUT
      shell: bash

    ######################################################################

    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.branch }}
    
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    ##############################################################################################

    - if: ${{ inputs.neoforge }}
      name: Build with Gradle Wrapper (NeoForge)
      run: ./gradlew :neoforge:build
      env:
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

    - if: ${{ inputs.neoforge }}
      name: Upload built Jar (NeoForge)
      uses: softprops/action-gh-release@v3
      with:
        tag_name: "${{ inputs.branch }}-neoforge-${{ steps.get_neoforge_version.outputs.version }}"
        name: "${{ inputs.branch }} ${{ steps.get_neoforge_version.outputs.version }} NeoForge Release"
        target_commitish: ${{ inputs.branch }}
        body_path: CHANGELOG.md
        draft: true
        prerelease: false
        files: |
          ./neoforge/build/libs/*.jar
        fail_on_unmatched_files: true

    ##############################################################################################

    - if: ${{ inputs.forge }}
      name: Build with Gradle Wrapper (Forge)
      run: ./gradlew :forge:build
      env:
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

    - if: ${{ inputs.forge }}
      name: Upload built Jar (Forge)
      uses: softprops/action-gh-release@v3
      with:
        tag_name: "${{ inputs.branch }}-forge-${{ steps.get_forge_version.outputs.version }}"
        name: "${{ inputs.branch }} ${{ steps.get_forge_version.outputs.version }} Forge Release"
        target_commitish: ${{ inputs.branch }}
        body_path: CHANGELOG.md
        draft: true
        prerelease: false
        files: |
          ./forge/build/libs/*.jar
        fail_on_unmatched_files: true

    ##############################################################################################

    - if: ${{ inputs.fabric }}
      name: Build with Gradle Wrapper (Fabric)
      run: ./gradlew :fabric:build
      env:
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

    - if: ${{ inputs.fabric }}
      name: Upload built Jar (Fabric)
      uses: softprops/action-gh-release@v3
      with:
        tag_name: "${{ inputs.branch }}-fabric-${{ steps.get_fabric_version.outputs.version }}"
        name: "${{ inputs.branch }} ${{ steps.get_fabric_version.outputs.version }} Fabric Release"
        target_commitish: ${{ inputs.branch }}
        body_path: CHANGELOG.md
        draft: true
        prerelease: false
        files: |
          ./fabric/build/libs/*.jar
        fail_on_unmatched_files: true
